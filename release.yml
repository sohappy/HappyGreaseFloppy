name: Release

# Push a tag such as v0.17.1 to test, build the three executables and publish a GitHub release.
# "Run workflow" (manual) builds them as downloadable artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc (2.35): runs on most current distributions
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-14
            name: macos-universal   # Apple Silicon + Intel in one app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: System libraries for eframe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        if: matrix.name != 'macos-universal'
        run: cargo build --release --locked -p hgf-gui
      - name: Build (universal macOS binary)
        if: matrix.name == 'macos-universal'
        run: |
          cargo build --release --locked -p hgf-gui --target aarch64-apple-darwin
          cargo build --release --locked -p hgf-gui --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/happygreasefloppy \
            target/aarch64-apple-darwin/release/happygreasefloppy target/x86_64-apple-darwin/release/happygreasefloppy
      - name: Package
        shell: bash
        run: bash packaging/package.sh "${{ matrix.name }}" "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: HappyGreaseFloppy-${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
